global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'couchdb-node1'
    static_configs:
      - targets: ['couchdb-node1:5984']
    metrics_path: '/_node/_local/_prometheus'

  - job_name: 'couchdb-node2'
    static_configs:
      - targets: ['couchdb-node2:5984']
    metrics_path: '/_node/_local/_prometheus'

  - job_name: 'couchdb-node3'
    static_configs:
      - targets: ['couchdb-node3:5984']
    metrics_path: '/_node/_local/_prometheus'

  - job_name: 'agent-coordinator'
    static_configs:
      - targets: ['agent-coordinator:8000']
    metrics_path: '/metrics'
